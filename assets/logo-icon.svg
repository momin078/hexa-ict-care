<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Hexagon Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>

    <!-- Inner Glow Gradient -->
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Tech Circuit Gradient -->
    <linearGradient id="techRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#dc2626" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Ambient Glow -->
  <polygon points="60,14 99.8,37 99.8,83 60,106 20.2,83 20.2,37"
           fill="none" stroke="url(#borderGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" filter="url(#shadow)" />

  <!-- Base Hexagon Body -->
  <polygon points="60,16 98,38 98,82 60,104 22,82 22,38"
           fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" stroke-linejoin="round" />

  <!-- Glossy top reflection highlight -->
  <path d="M 60,18 L 96,39 L 96,60 C 96,60 78,48 60,48 C 42,48 24,60 24,60 L 24,39 Z"
        fill="url(#innerGlow)" />

  <!-- Circuit Tech Dots & Connectors -->
  <circle cx="60" cy="24" r="2.5" fill="#fca5a5" />
  <line x1="60" y1="24" x2="60" y2="34" stroke="#fca5a5" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>

  <circle cx="28" cy="80" r="2" fill="#ef4444" opacity="0.7"/>
  <circle cx="92" cy="80" r="2" fill="#ef4444" opacity="0.7"/>

  <!-- Center Stylized 'H' & Coding Brackets '< / >' -->
  <g transform="translate(60, 60)" text-anchor="middle" dominant-baseline="central">
    <!-- Left Bracket `<` forming left leg of H -->
    <polyline points="-14,-19 -24,0 -14,19" fill="none" stroke="url(#techRed)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Right Bracket `>` forming right leg of H -->
    <polyline points="14,-19 24,0 14,19" fill="none" stroke="url(#techRed)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Center Slash `/` and connection beam -->
    <line x1="-16" y1="0" x2="16" y2="0" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    
    <!-- Binary / Tech Nodes on H center bar -->
    <circle cx="0" cy="0" r="4.5" fill="#dc2626" stroke="#ffffff" stroke-width="2" />
    <circle cx="-16" cy="0" r="2" fill="#ffffff" />
    <circle cx="16" cy="0" r="2" fill="#ffffff" />
    
    <!-- Small Slash Accent -->
    <line x1="-3" y1="-12" x2="3" y2="12" stroke="#fecaca" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- Bottom Accent Tag -->
  <rect x="44" y="90" width="32" height="7" rx="3.5" fill="#dc2626" />
  <text x="60" y="95.5" font-family="'Poppins', sans-serif" font-size="5" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">ICT</text>
</svg>
